<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Centroid Finder mark: a ring with its centroid and a fading trail.
       Same drawing as src/components/layout/LogoMark.tsx. -->
  <style>
    .tile { fill: #f1ebe1; }
    .ink { fill: #52705a; }
    .ring { fill: none; stroke: #52705a; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #27211c; }
      .ink { fill: #a9c2a9; }
      .ring { stroke: #a9c2a9; }
    }
  </style>
  <rect class="tile" x="0.5" y="0.5" width="31" height="31" rx="10" />
  <circle class="ink" cx="7.5" cy="24" r="1.6" opacity="0.4" />
  <circle class="ink" cx="11" cy="21.5" r="1.8" opacity="0.65" />
  <circle class="ring" cx="18" cy="14" r="7.5" stroke-width="2" />
  <circle class="ink" cx="18" cy="14" r="3" />
</svg>
